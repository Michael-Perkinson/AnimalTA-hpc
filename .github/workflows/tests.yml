name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y python3-tk libmediainfo0v5

      - name: Install AnimalTA and test dependencies
        run: python -m pip install ".[dev]"

      - name: Run tests
        run: python -m pytest -q
