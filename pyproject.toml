[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "animalta"
version = "4.0.0"
description = "AnimalTA video tracking for Open OnDemand"
authors = [{ name = "Michael Perkinson" }]
requires-python = ">=3.11"
dependencies = [
    "opencv-python-headless>=4.8.0",
    "Pillow>=10.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.3.0",
    "scikit-image>=0.21.0",
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
    "decord>=0.6.0",
    "h5py>=3.9.0",
    "pymediainfo>=6.0.0",
    "pandastable>=0.13.0",
    "psutil>=5.9.0",
    "pymsgbox>=1.0.9",
    "tksheet>=7.0.0",
]

[project.optional-dependencies]
gpu = ["cupy-cuda12x[ctk]>=13.0.0"]
dev = ["pytest>=7.0.0", "hypothesis>=6.0.0"]

[project.scripts]
animalta = "main:main"

[tool.setuptools]
py-modules = ["main"]
include-package-data = true

[tool.setuptools.packages.find]
include = ["AnimalTA*"]
namespaces = true

[tool.setuptools.package-data]
AnimalTA = ["Files/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
